[package]
name = "stash-desktop"
version = "0.1.0"
description = "STASH Welcome / Sign in desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = "2"
winfsp = { version = "0.13.1", features = ["delayload"] }

[dependencies]
tauri = { version = "2", features = [] }
aws-config = { version = "1", default-features = false }
aws-sdk-cognitoidentityprovider = "1"
aws-cognito-srp = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
stash-core = { path = "../../../crates/stash-core" }
stash-s3-provider = { path = "../../../crates/stash-s3-provider" }
stash-windows-fs = { path = "../../../crates/stash-windows-fs" }
winfsp = "0.13.1"
windows = { version = "0.61", features = ["Win32_System_LibraryLoader"] }
